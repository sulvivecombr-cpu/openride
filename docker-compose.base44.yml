# Base44 dev environment: Supabase-compatible backend (db/auth/rest) + Next.js admin console.
x-pg: &pgpass local-dev-postgres-password
services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: on-failure
    environment:
      POSTGRES_PASSWORD: *pgpass
      POSTGRES_HOST: /var/run/postgresql
      JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    ports: ["54322:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
  dbinit:
    image: supabase/postgres:15.8.1.060
    depends_on: {db: {condition: service_healthy}}
    environment: {PGPASSWORD: *pgpass}
    entrypoint: ["bash", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -h db -U supabase_admin -d postgres -c "alter role supabase_auth_admin with password 'local-dev-postgres-password'" -c "alter role authenticator with password 'local-dev-postgres-password'"
  auth:
    image: supabase/gotrue:v2.158.1
    restart: on-failure
    depends_on: {db: {condition: service_healthy}, dbinit: {condition: service_completed_successfully}}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://54321-${BASE44_PUBLIC_HOST_SUFFIX}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:local-dev-postgres-password@db:5432/postgres
      GOTRUE_SITE_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_SMS_PROVIDER: twilio
      GOTRUE_SMS_TWILIO_ACCOUNT_SID: ACdev_local_only
      GOTRUE_SMS_TWILIO_AUTH_TOKEN: dev_local_only_unused
      GOTRUE_SMS_TWILIO_MESSAGE_SERVICE_SID: MGdev_local_only
      GOTRUE_SMS_TEST_OTP: "+61400000010:123456,+61400000011:123456,+61400000012:123456,+61400000020:123456,+61400000021:123456"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 30
  rest:
    image: postgrest/postgrest:v12.2.0
    restart: on-failure
    depends_on: {migrate: {condition: service_completed_successfully}}
    environment:
      PGRST_DB_URI: postgres://authenticator:local-dev-postgres-password@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_MAX_ROWS: 1000
  migrate:
    image: supabase/postgres:15.8.1.060
    depends_on:
      db: {condition: service_healthy}
      auth: {condition: service_healthy}
    environment: {PGPASSWORD: *pgpass}
    volumes: ["./infra/supabase:/sb:ro"]
    entrypoint: ["bash", "-ec"]
    command:
      - |
        P="psql -v ON_ERROR_STOP=1 -h db -U supabase_admin -d postgres"
        $$P -c "create table if not exists public._base44_migrations(name text primary key)"
        for f in /sb/migrations/*.sql; do
          n=$$(basename $$f)
          if [ "$$($$P -tAc "select 1 from public._base44_migrations where name='$$n'")" != 1 ]; then
            echo applying $$n; $$P -f $$f; $$P -c "insert into public._base44_migrations values ('$$n')"
          fi
        done
        $$P -f /sb/seed.sql
  gateway:
    image: nginx:alpine
    restart: on-failure
    depends_on: [auth, rest]
    ports: ["54321:8000"]
    volumes: ["./infra/base44/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
  admin:
    image: node:22
    restart: on-failure
    working_dir: /app
    depends_on: {gateway: {condition: service_healthy}}
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_SUPABASE_URL: https://54321-${BASE44_PUBLIC_HOST_SUFFIX}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTc5OTUzNTYwMH0.F_rDxRTPE8OU83L_CNgEGXfmirMXmMMugT29Cvc8ygQ
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
      CI: "true"
      WATCHPACK_POLLING: "true"
    volumes: [".:/app", "node_modules:/app/node_modules"]
    command: ["sh", "-ec", "corepack enable && pnpm install --frozen-lockfile && exec pnpm --filter @openride/admin exec next dev -p 3000 -H 0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:3000/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
volumes:
  dbdata:
  node_modules:
