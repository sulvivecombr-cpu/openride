server {
  listen 8000;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Allow-Headers "*" always;
  add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
  add_header Access-Control-Expose-Headers "*" always;
  if ($request_method = OPTIONS) { return 204; }
  location /auth/v1/ { proxy_pass http://auth:9999/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_hide_header Access-Control-Allow-Headers; proxy_hide_header Access-Control-Allow-Methods; proxy_hide_header Access-Control-Expose-Headers; }
  location /rest/v1/ { proxy_pass http://rest:3000/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_hide_header Access-Control-Allow-Headers; proxy_hide_header Access-Control-Allow-Methods; proxy_hide_header Access-Control-Expose-Headers; }
  location = /healthz { return 200 ok; }
}
